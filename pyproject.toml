[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haru-mcp"
version = "0.3.0"
description = "Self-hosted MCP gateway for an isolated VPS workspace"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "kohaku4yz" }]
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "mcp>=1.27,<2",
  "anyio>=4,<5",
  "httpx>=0.28,<1",
  "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.urls]
Homepage = "https://github.com/kohaku4yz/haru-vps-mcp"
Repository = "https://github.com/kohaku4yz/haru-vps-mcp"
Documentation = "https://github.com/kohaku4yz/haru-vps-mcp#readme"

[project.scripts]
haru-mcp = "haru_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["haru_mcp*"]

[tool.setuptools.package-data]
haru_mcp = ["HARU-INSTRUCTIONS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
