name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Verify package and public deployment examples
        run: |
          test -x deploy/verify.sh
          bash deploy/verify.sh

      - name: Check patch hygiene
        run: git diff --check

      - name: Check public-tree sanitization
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import re

          blocked = [
              "yuz" + "uwkhk",
              "kannch" + "8765",
              "claude" + "-p",
              "sub" + "con",
              "relationship" + "-memory",
              "/srv/" + "haru-mcp-workspace",
              "rack" + "nerd",
              "tg" + "-bridge",
          ]
          credential_patterns = [
              re.compile(r"github_pat_[A-Za-z0-9_]{20,}"),
              re.compile(r"ghp_[A-Za-z0-9]{20,}"),
              re.compile(r"sk-[A-Za-z0-9_-]{20,}"),
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
          ]

          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw in paths:
              if not raw:
                  continue
              path = Path(raw.decode())
              data = path.read_bytes()
              text = data.decode("utf-8", errors="ignore")
              for marker in blocked:
                  if marker in text:
                      raise SystemExit(f"private identifier found in {path}: {marker}")
              for pattern in credential_patterns:
                  if pattern.search(text):
                      raise SystemExit(f"credential-like literal found in {path}: {pattern.pattern}")
          print("public_tree_sanitization=PASS")

  python310-timeout-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Verify supervisor timeout compatibility
        run: >-
          python -m pytest -q
          tests/test_workspace_supervisor_py310.py

  workspace-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install disposable workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[test]' 'mcp-proxy==0.12.0' 'mcp==1.27.1'
          NODE_ROOT="$RUNNER_TEMP/haru-node"
          npm install --prefix "$NODE_ROOT" --omit=dev \
            '@modelcontextprotocol/server-filesystem@2026.7.10' \
            'shell-exec-mcp@1.2.0'
          NODE_ROOT="$NODE_ROOT" bash deploy/workspace/install-managed-shell-patch.sh

      - name: Kill real named backends and verify fail-closed recovery
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$RUNNER_TEMP/haru-resilience-workspace"
          NODE_ROOT="$RUNNER_TEMP/haru-node"
          mkdir -p "$WORKSPACE"
          python deploy/workspace/verify-resilience.py \
            --workspace "$WORKSPACE" \
            --proxy "$(command -v mcp-proxy)" \
            --filesystem "$NODE_ROOT/node_modules/.bin/mcp-server-filesystem" \
            --shell "$NODE_ROOT/node_modules/.bin/shell-exec-mcp"
